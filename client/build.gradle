def minecraftVersion = project.minecraft_version
def mappingsMode = project.findProperty('mapping_mode') ?: 'yarn'
def directMappings = mappingsMode == 'none'
def javaMajorVersion = project.findProperty('java_major_version') ?: (minecraftVersion.startsWith('26.') ? '25' : (minecraftVersion.startsWith('1.20.5') || minecraftVersion.startsWith('1.20.6') || minecraftVersion.startsWith('1.21.') || minecraftVersion == '1.21' ? '21' : '17'))

if (directMappings) {
    apply plugin: 'net.fabricmc.fabric-loom'
} else {
    apply plugin: 'fabric-loom'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        herbruclient {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (mappingsMode == 'mojang') {
        mappings loom.officialMojangMappings()
    } else if (!directMappings) {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    }
    if (directMappings) {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    } else {
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    }
}

sourceSets.client.java.setSrcDirs([
    directMappings ? 'src/client/mojang/java' : 'src/client/java',
])

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.findProperty('build_java_version') ?: 25)
    sourceCompatibility = JavaVersion.toVersion(javaMajorVersion)
    targetCompatibility = JavaVersion.toVersion(javaMajorVersion)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(javaMajorVersion)
}

processResources {
    inputs.properties([
        version: project.version,
        minecraft_version: minecraftVersion,
        java_major_version: javaMajorVersion,
    ])
    filesMatching('fabric.mod.json') {
        expand(
            version: project.version,
            minecraft_version: minecraftVersion,
            java_major_version: javaMajorVersion,
        )
    }
}